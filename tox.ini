[tox]
envlist = py3, node
skipsdist = true

[testenv:py3]
description = installer syntax
allowlist_externals = python3, python
commands =
    python3 -m py_compile scripts/install-mcp.py

[testenv:node]
description = MCP unit tests
allowlist_externals = node
commands =
    node --test src/*.test.mjs
